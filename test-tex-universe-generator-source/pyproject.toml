[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "test-tex-universe-generator"
version = "0.1.0"
description = "Stateful, coverage-guided generator of syntactically valid mathematical TeX universes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
test-tex-gen = "test_tex_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
